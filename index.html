<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoneyFlow">
<link rel="manifest" href="manifest.json">
<title>MoneyFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header><div><h1>MONEYFLOW</h1><p>Ақшаңды бақылаудың жеңіл жолы</p></div><button id="reset">↺</button></header>

  <section class="balance card">
    <span>ҚАЛҒАН АҚША</span>
    <strong id="balance">450 000 ₸</strong>
    <div class="income">Айлық табыс <b>450 000 ₸</b></div>
  </section>

  <section class="card">
    <div class="row"><div><b>🔔 Операцияны тексеру</b><p class="muted">Демо режим: төлемді имитациялап, бірден сұрақ шығарады.</p></div>
      <button class="ghost" id="notifyBtn">Хабарлама рұқсаты</button>
    </div>
    <div class="actions">
      <button class="pay" id="cardPay">💳 8 500 ₸ төлем</button>
      <button class="transfer" id="transfer">💸 20 000 ₸ перевод</button>
    </div>
  </section>

  <section class="card">
    <div class="row"><b>＋ Төлем қосу</b><span class="muted">Соманы енгізіп, категория таңда</span></div>
    <form id="addForm">
      <input id="amount" inputmode="numeric" placeholder="Сома, ₸" required>
      <select id="category"><option>🍔 Тамақ</option><option>🚕 Такси</option><option>🛍️ Сауда</option><option>🎮 Ойын-сауық</option><option>📚 Оқу</option><option>🏠 Үй</option></select>
      <button>Қосу</button>
    </form>
  </section>

  <section class="card"><div class="row"><b>Осы ай</b><b id="spent">0 ₸ төлем</b></div><div id="list" class="list"><p class="muted">Әзірге шығын жоқ.</p></div></section>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji">💳</div>
    <h2>Жаңа операция</h2>
    <p id="operationText"></p>
    <p class="question">Бұл ақша қайда жұмсалды?</p>
    <div class="cats" id="cats"></div>
    <button class="close" id="cancel">Кейінірек</button>
  </div>
</div>
<script src="app.js"></script>
</body></html>
